<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AI Engine Side Panel</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #212121;
    }
    iframe {
      width: 100%; height: 100%; border: none; position: relative; z-index: 2;
    }
    #loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
      color: #888; font-family: sans-serif; font-size: 13px; z-index: 1;
    }
  </style>
</head>
<body>
  <div id="loading">Initializing AI Engine…</div>
  <!-- The src will be dynamically injected by sidepanel.js based on chrome.storage.local -->
  <iframe id="ai-frame" allow="clipboard-read; clipboard-write; microphone"></iframe>
  
  <script src="sidepanel.js"></script>
</body>
</html>
