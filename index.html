<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LocKit — Game Translation Manager</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230e0f13'/%3E%3Crect x='4' y='8' width='16' height='3' rx='1.5' fill='%234fffb0'/%3E%3Crect x='4' y='14' width='24' height='3' rx='1.5' fill='%234fffb0' opacity='.6'/%3E%3Crect x='4' y='20' width='20' height='3' rx='1.5' fill='%234fffb0' opacity='.35'/%3E%3C/svg%3E">

<!-- Styles: base → table → modals → feature components -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/table.css">
<link rel="stylesheet" href="css/modals.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>

<!-- ── Header ─────────────────────────────────────────────────────────────── -->
<header>
  <div class="logo">Loc<span>Kit</span></div>
  <div style="color:var(--text-muted);font-size:12px;">game translation manager</div>

  <div class="header-stats">
    <div class="stat">
      <span class="stat-num" id="stat-strings">0</span>
      <span class="stat-label">strings</span>
    </div>
    <div class="stat">
      <span class="stat-num" id="stat-langs">0</span>
      <span class="stat-label">languages</span>
    </div>
    <div class="stat">
      <span class="stat-num" id="stat-cats">0</span>
      <span class="stat-label">categories</span>
    </div>
  </div>

  <div class="header-actions">
    <!-- Project name: double-click to rename -->
    <div class="project-name-wrap" id="project-name-wrap" title="Double-click to rename">
      <span class="project-name-display no-project" id="project-name-display"
            ondblclick="startRenameProject()">no project</span>
      <input class="project-name-input" id="project-name-input" style="display:none"
             onblur="commitRenameProject()"
             onkeydown="if(event.key==='Enter')commitRenameProject();
                        if(event.key==='Escape')cancelRenameProject();">
    </div>
    <div class="save-indicator" id="save-indicator"><span class="dot"></span></div>

    <button class="btn btn-ghost" onclick="openLoadProject()" title="Load a .lockit.json project">↓ Load</button>
    <button class="btn btn-ghost" onclick="saveProject()"     title="Save project as .lockit.json">↑ Save</button>
    <div style="width:1px;height:20px;background:var(--border)"></div>
    <button class="btn btn-ghost"   onclick="openAddCategory()">+ Category</button>
    <button class="btn btn-primary" onclick="openImport()">↑ Import CSV</button>
  </div>
</header>

<!-- ── Layout ─────────────────────────────────────────────────────────────── -->
<div class="layout">

  <!-- Sidebar: category filter -->
  <aside class="sidebar">
    <div class="sidebar-title">Categories</div>
    <div class="cat-list" id="cat-list">
      <div class="cat-item active" data-cat="__ALL__" onclick="setCategory('__ALL__')">
        <span>All Strings</span>
        <span class="cat-count" id="count-all">0</span>
      </div>
    </div>
  </aside>

  <!-- Main content -->
  <div class="main">

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-box">
        <input type="text" id="global-search" placeholder="Search all columns…"
               oninput="onGlobalSearch()">
      </div>
      <div class="toolbar-sep"></div>
      <button class="btn btn-export btn-sm" onclick="openExportDialog()">↓ Export CSV</button>
      <button class="btn btn-ghost  btn-sm" onclick="openAddString()">+ Add String</button>
      <div class="toolbar-sep"></div>
      <!-- Column visibility toggle -->
      <div class="col-toggle-wrap" id="col-toggle-wrap">
        <button class="btn btn-ghost btn-sm" id="col-toggle-btn" onclick="toggleColDropdown()">
          <span id="col-toggle-label">Columns</span> ▾
        </button>
        <div class="col-dropdown" id="col-dropdown" style="display:none"></div>
      </div>
      <span style="margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--text-muted)"
            id="row-count"></span>
    </div>

    <!-- Table -->
    <div class="table-wrap">
      <table id="main-table">
        <thead>
          <tr id="header-row"></tr>
          <tr class="filter-row" id="filter-row"></tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
      <div class="empty-state" id="empty-state" style="display:none">
        <div class="icon">⌨</div>
        <p>No strings yet. Import a CSV to get started.</p>
      </div>
    </div>

  </div>
</div>

<!-- ── Footer ─────────────────────────────────────────────────────────────── -->
<footer>
  <span id="footer-status">Ready</span>
  <span style="margin-left:auto">LocKit v1.0</span>
</footer>

<!-- Modal mount point -->
<div id="modal-root"></div>

<!-- ── Scripts ────────────────────────────────────────────────────────────── -->
<!--
  Load order matters:
    1. db.js      — db object + interceptors + state (everything reads these)
    2. utils.js   — pure helpers (no dependencies)
    3. render.js  — reads db, state, utils; called by later modules
    4. modal.js   — called by all feature modules
    5. edit.js    — calls render, modal, db
    6. import.js  — calls render, modal, db, utils
    7. export.js  — calls render, modal, db, utils
    8. project.js — calls render, modal, db, utils, prefs
    9. prefs.js   — calls render; reads/writes state.colWidths / hiddenCols
   10. ai.js      — calls modal, db, render
   11. main.js    — global listeners + bootstrap (must be last)
-->
<script src="js/db.js"></script>
<script src="js/utils.js"></script>
<script src="js/render.js"></script>
<script src="js/modal.js"></script>
<script src="js/edit.js"></script>
<script src="js/import.js"></script>
<script src="js/export.js"></script>
<script src="js/project.js"></script>
<script src="js/prefs.js"></script>
<script src="js/ai.js"></script>
<script src="js/main.js"></script>

</body>
</html>
